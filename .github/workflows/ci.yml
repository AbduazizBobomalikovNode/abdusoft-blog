name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # pnpm versiyasi root package.json'dagi "packageManager" maydonidan olinadi.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # apps/web va apps/api @blog/shared'ning build natijasiga tayanadi.
      - name: Build shared package
        run: pnpm --filter @blog/shared build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          # Faqat build uchun placeholder qiymatlar — haqiqiy sirlar yo'q.
          NEXT_PUBLIC_API_URL: http://localhost:4000
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_SITE_NAME: abdusoft

  # Deploy skriptlari (scripts/server-deploy*.sh, make-deploy-bundle.sh) va ularning
  # lokal simulyatsiyasi — haqiqiy server/systemd/tarmoqsiz.
  deploy-scripts:
    name: Deploy scripts (shellcheck, simulation)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Shellcheck
        run: shellcheck -s bash scripts/server-deploy.sh scripts/server-deploy-entry.sh scripts/make-deploy-bundle.sh scripts/tests/server-deploy-sim.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Simulation
        run: ./scripts/tests/server-deploy-sim.sh
